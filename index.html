<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chicago Transit Dashboard</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<main>
    <header class="dashboard-header">
        <div>
            <h1>Chicago Transit Dashboard</h1>
            <p>Live CTA rail activity and Chicago weather</p>
        </div>

        <div class="live-status">
            <div id="train-count">
                Loading trains...
            </div>

            <div id="last-updated">
                Updating...
            </div>
        </div>
    </header>

    <div class="dashboard-layout">

        <section class="map-panel">
            <div id="train-list"></div>
        </section>

        <aside class="info-panel">

            <section class="info-card weather-card">
                <h2>Chicago Weather</h2>

                <div id="weather-current">
                    <p>Weather data coming soon.</p>
                </div>
            </section>

            <section class="info-card">
                <h2>System Overview</h2>

                <p>
                    Live CTA rail activity across all eight lines.
                </p>
            </section>

            <section class="info-card station-card">
                <h2>Station Details</h2>

                <div id="station-details">
                    <p>Select a station to view details.</p>
                </div>
            </section>

        </aside>

    </div>

</main>

<script type="module" src="js/app.js"></script>

</body>
</html>
