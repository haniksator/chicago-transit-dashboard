<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chicago Transit Dashboard</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<main>
    <header class="dashboard-header">
        <div>
            <h1>Chicago Transit Dashboard</h1>
            <p>Live CTA rail activity and Chicago weather</p>
        </div>

        <div class="live-status">
            <div id="train-count">
                Loading trains...
            </div>

            <div id="last-updated">
                Updating...
            </div>
        </div>
    </header>

    <div class="dashboard-layout">

        <section class="map-panel">

            <div class="map-header">
                <h2 id="map-title">
                    All CTA Lines
                </h2>
            </div>

            <div class="line-filter">
                <button
                        class="line-filter-btn active"
                        data-line="all"
                >
                    All
                </button>

                <button
                        class="line-filter-btn"
                        data-line="red"
                >
                    Red
                </button>

                <button
                        class="line-filter-btn"
                        data-line="blue"
                >
                    Blue
                </button>

                <button
                        class="line-filter-btn"
                        data-line="brn"
                >
                    Brown
                </button>

                <button
                        class="line-filter-btn"
                        data-line="g"
                >
                    Green
                </button>

                <button
                        class="line-filter-btn"
                        data-line="org"
                >
                    Orange
                </button>

                <button
                        class="line-filter-btn"
                        data-line="pink"
                >
                    Pink
                </button>

                <button
                        class="line-filter-btn"
                        data-line="p"
                >
                    Purple
                </button>

                <button
                        class="line-filter-btn"
                        data-line="y"
                >
                    Yellow
                </button>
            </div>

            <div id="train-list"></div>

        </section>

        <aside class="info-panel">

            <section class="info-card weather-card">
                <h2>Chicago Weather</h2>

                <div id="weather-current">
                    <p>Weather data coming soon.</p>
                </div>

                <div class="weather-source">
                    Weather data by
                    <a
                            href="https://open-meteo.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                    >
                        Open-Meteo
                    </a>
                </div>
            </section>

            <section class="info-card system-card">
                <h2>System Overview</h2>

                <div id="system-overview">
                    <p>Loading system data...</p>
                </div>
            </section>

            <section class="info-card station-card">
                <h2>Station Details</h2>

                <div id="station-details">
                    <p>Select a station to view details.</p>
                </div>
            </section>

        </aside>

    </div>

</main>

<script type="module" src="js/app.js"></script>

</body>
</html>
